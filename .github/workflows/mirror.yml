name: Mirror to Codeberg

on:
  push:
    branches:
      - '**'
    tags:
      - '*'

jobs:
  mirror:
    # Dependabot runs cannot access repository Actions secrets.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mirror to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          # Accept both a raw token and existing username:token credentials.
          case "$CODEBERG_TOKEN" in
            *:*) credentials="$CODEBERG_TOKEN" ;;
            *) credentials="james-yusuke:$CODEBERG_TOKEN" ;;
          esac
          git remote add codeberg "https://${credentials}@codeberg.org/james-yusuke/YCPL.git"

          git push codeberg --all

          git push codeberg --tags
